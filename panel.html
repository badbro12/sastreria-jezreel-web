<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel del taller — Sastrería Jezreel</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#0B0D10; --ink-2:#15181D; --bone:#F5F2ED; --bone-2:#EAE5DC;
    --ice:#BFE1EC; --ice-dim:#8FB9C8; --steel:#46697A; --brass:#A6824F;
    --urgent:#c65b4e; --warn:#c6a24e; --ok:#5eae7e;
    --serif:'Fraunces',serif; --sans:'Inter',sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bone); color:var(--ink); font-family:var(--sans); min-height:100vh; }
  header{ background:var(--ink); color:var(--bone); padding:1.6rem 2rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; }
  header h1{ font-family:var(--serif); font-size:1.3rem; font-weight:500; }
  header h1 span{ color:var(--ice); }
  header .sub{ font-family:var(--mono); font-size:.7rem; opacity:.6; letter-spacing:.08em; }
  header .who{ display:flex; align-items:center; gap:1rem; font-family:var(--mono); font-size:.72rem; }
  header .who button{ background:transparent; border:1px solid rgba(245,242,237,.3); color:var(--bone); padding:.4rem .8rem; border-radius:4px; cursor:pointer; font-family:var(--mono); font-size:.68rem; }
  header .who button:hover{ border-color:var(--ice); color:var(--ice); }
  main{ max-width:1100px; margin:0 auto; padding:2.2rem 1.4rem 4rem; }

  /* ---- LOGIN ---- */
  #loginGate{ min-height:80vh; display:flex; align-items:center; justify-content:center; padding:2rem; }
  .login-box{ background:#fff; border:1px solid #ddd6c9; border-radius:8px; padding:2.4rem; width:100%; max-width:360px; }
  .login-box h2{ font-family:var(--serif); font-size:1.4rem; margin-bottom:.4rem; }
  .login-box p.hint{ font-family:var(--mono); font-size:.72rem; color:#8a8677; margin-bottom:1.6rem; }
  .login-box label{ display:block; font-family:var(--mono); font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:#6b675e; margin:1rem 0 .3rem; }
  .login-box label:first-of-type{ margin-top:0; }
  .login-box input{ width:100%; padding:.65rem .7rem; border:1px solid #cfc7b5; border-radius:4px; font-size:.9rem; background:#fdfcf9; }
  .login-box button{ margin-top:1.4rem; width:100%; background:var(--ink); color:var(--bone); border:none; padding:.85rem; border-radius:4px; font-weight:600; font-size:.85rem; cursor:pointer; }
  .login-box button:hover{ background:var(--steel); }
  .login-msg{ font-family:var(--mono); font-size:.72rem; margin-top:.8rem; min-height:1em; color:var(--urgent); }

  #appContent{ display:none; }

  .layout{ display:grid; grid-template-columns:380px 1fr; gap:2rem; align-items:start; }
  @media(max-width:880px){ .layout{ grid-template-columns:1fr; } }

  .card-panel{ background:#fff; border:1px solid #ddd6c9; border-radius:6px; padding:1.6rem; }
  .card-panel h2{ font-family:var(--serif); font-size:1.15rem; margin-bottom:1.1rem; }

  form label{ display:block; font-family:var(--mono); font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:#6b675e; margin:.9rem 0 .3rem; }
  form label:first-child{ margin-top:0; }
  form input, form select{
    width:100%; padding:.6rem .7rem; border:1px solid #cfc7b5; border-radius:4px; font-family:var(--sans); font-size:.9rem; background:#fdfcf9;
  }
  form input:focus, form select:focus{ outline:2px solid var(--ice-dim); border-color:var(--steel); }
  .med-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 1rem; }
  .checkline{ display:flex; align-items:center; gap:.5rem; margin-top:1rem; }
  .checkline input{ width:auto; }
  .checkline label{ margin:0; text-transform:none; letter-spacing:0; font-family:var(--sans); font-size:.85rem; color:var(--ink); }

  button.submit{
    margin-top:1.4rem; width:100%; background:var(--ink); color:var(--bone); border:none;
    padding:.85rem; border-radius:4px; font-weight:600; font-size:.85rem; cursor:pointer; transition:background .2s;
  }
  button.submit:hover{ background:var(--steel); }
  button.submit:disabled{ opacity:.6; cursor:default; }

  .list-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:1.2rem; flex-wrap:wrap; gap:.6rem; }
  .list-head h2{ font-family:var(--serif); font-size:1.4rem; }
  .filters{ display:flex; gap:.5rem; }
  .filters button{ font-family:var(--mono); font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; padding:.4rem .8rem; border:1px solid #cfc7b5; background:#fff; border-radius:20px; cursor:pointer; }
  .filters button.active{ background:var(--ink); color:var(--bone); border-color:var(--ink); }

  .client{
    background:#fff; border:1px solid #ddd6c9; border-left:5px solid var(--ok); border-radius:6px;
    padding:1.1rem 1.3rem; margin-bottom:.9rem;
  }
  .client.urgente{ border-left-color:var(--urgent); }
  .client.proximo{ border-left-color:var(--warn); }
  .client-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; flex-wrap:wrap; }
  .client-top h3{ font-family:var(--serif); font-size:1.1rem; }
  .client-top .meta{ font-family:var(--mono); font-size:.72rem; color:#7a7669; margin-top:.2rem; }
  .badge{ font-family:var(--mono); font-size:.65rem; letter-spacing:.06em; text-transform:uppercase; padding:.25rem .6rem; border-radius:20px; white-space:nowrap; }
  .badge.urgente{ background:#fbe8e5; color:var(--urgent); }
  .badge.proximo{ background:#f8f0dd; color:#8a6d1f; }
  .badge.ok{ background:#e3f3e9; color:#2f7a52; }
  .medidas{ display:flex; flex-wrap:wrap; gap:.5rem 1.2rem; margin-top:.8rem; font-family:var(--mono); font-size:.75rem; color:#4a473f; }
  .medidas span b{ color:var(--ink); }
  .client-actions{ margin-top:.9rem; display:flex; gap:.6rem; }
  .client-actions button{ font-size:.72rem; padding:.4rem .7rem; border-radius:4px; border:1px solid #cfc7b5; background:#fff; cursor:pointer; }
  .client-actions button.del{ color:var(--urgent); border-color:#e6c3bd; }
  .empty{ text-align:center; padding:3rem 1rem; color:#8a8677; font-family:var(--mono); font-size:.8rem; }
  .status-msg{ font-family:var(--mono); font-size:.72rem; margin-top:.6rem; min-height:1em; }
  .status-msg.err{ color:var(--urgent); }
  .status-msg.ok{ color:var(--ok); }
  .note{ font-family:var(--mono); font-size:.68rem; color:#9a9585; margin-top:1.2rem; line-height:1.5; }
</style>
</head>
<body>

<div id="loginGate">
  <div class="login-box">
    <h2>Panel del taller</h2>
    <p class="hint">Acceso solo para Sastrería Jezreel</p>
    <form id="loginForm">
      <label for="email">Correo</label>
      <input id="email" type="email" required autocomplete="username">
      <label for="password">Contraseña</label>
      <input id="password" type="password" required autocomplete="current-password">
      <button type="submit" id="loginBtn">Entrar</button>
      <p class="login-msg" id="loginMsg"></p>
    </form>
  </div>
</div>

<div id="appContent">
<header>
  <h1>PANEL DEL <span>TALLER</span></h1>
  <div class="who">
    <span id="userEmail"></span>
    <button id="logoutBtn">Cerrar sesión</button>
  </div>
</header>

<main>
  <div class="layout">
    <div class="card-panel">
      <h2>Nuevo cliente / pedido</h2>
      <form id="clientForm">
        <label for="nombre">Nombre del cliente</label>
        <input id="nombre" required placeholder="Ej. Marco Quispe">

        <label for="telefono">Teléfono</label>
        <input id="telefono" placeholder="Ej. 700 00000">

        <label for="prenda">Prenda</label>
        <select id="prenda">
          <option>Traje completo</option>
          <option>Saco</option>
          <option>Pantalón</option>
          <option>Chaleco</option>
          <option>Falda sastre</option>
          <option>Blazer</option>
        </select>

        <label>Medidas (cm)</label>
        <div class="med-grid">
          <div><label for="pecho">Pecho</label><input id="pecho" type="number" step="0.5"></div>
          <div><label for="cintura">Cintura</label><input id="cintura" type="number" step="0.5"></div>
          <div><label for="cadera">Cadera</label><input id="cadera" type="number" step="0.5"></div>
          <div><label for="hombro">Hombro</label><input id="hombro" type="number" step="0.5"></div>
          <div><label for="manga">Largo manga</label><input id="manga" type="number" step="0.5"></div>
          <div><label for="pierna">Largo pierna</label><input id="pierna" type="number" step="0.5"></div>
          <div><label for="cuello">Cuello</label><input id="cuello" type="number" step="0.5"></div>
          <div><label for="espalda">Largo espalda</label><input id="espalda" type="number" step="0.5"></div>
        </div>

        <label for="fecha">Fecha de entrega</label>
        <input id="fecha" type="date" required>

        <div class="checkline">
          <input id="urgente" type="checkbox">
          <label for="urgente">Entrega urgente</label>
        </div>

        <button type="submit" class="submit" id="submitBtn">Guardar cliente</button>
        <p class="status-msg" id="formMsg"></p>
      </form>
      <p class="note">Datos guardados en tu base de datos de Supabase — persisten para siempre, sin importar desde qué celular o computadora entres.</p>
    </div>

    <div>
      <div class="list-head">
        <h2>Pedidos activos</h2>
        <div class="filters" id="filters">
          <button class="active" data-f="todos">Todos</button>
          <button data-f="urgente">Urgentes</button>
          <button data-f="proximo">Próximos</button>
        </div>
      </div>
      <div id="clientList"><div class="empty">Cargando pedidos…</div></div>
    </div>
  </div>
</main>
</div>

<script src="js/supabaseClient.js"></script>
<script>
  let clientes = [];
  let filtro = 'todos';

  // ---------- LOGIN ----------
  async function checkSession(){
    const { data: { session } } = await window.sb.auth.getSession();
    if(session){ mostrarApp(session); } else { mostrarLogin(); }
  }
  function mostrarLogin(){
    document.getElementById('loginGate').style.display = 'flex';
    document.getElementById('appContent').style.display = 'none';
  }
  function mostrarApp(session){
    document.getElementById('loginGate').style.display = 'none';
    document.getElementById('appContent').style.display = 'block';
    document.getElementById('userEmail').textContent = session.user.email;
    cargarClientes();
  }

  document.getElementById('loginForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const msg = document.getElementById('loginMsg');
    btn.disabled = true; btn.textContent = 'Entrando…'; msg.textContent = '';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const { data, error } = await window.sb.auth.signInWithPassword({ email, password });
    btn.disabled = false; btn.textContent = 'Entrar';
    if(error){
      msg.textContent = 'Correo o contraseña incorrectos.';
      return;
    }
    mostrarApp(data.session);
  });

  document.getElementById('logoutBtn').addEventListener('click', async ()=>{
    await window.sb.auth.signOut();
    mostrarLogin();
  });

  // ---------- CLIENTES ----------
  async function cargarClientes(){
    const list = document.getElementById('clientList');
    list.innerHTML = '<div class="empty">Cargando pedidos…</div>';
    const { data, error } = await window.sb.from('clientes').select('*').order('fecha', { ascending: true });
    if(error){
      list.innerHTML = `<div class="empty">No se pudo cargar: ${escapeHtml(error.message)}</div>`;
      return;
    }
    clientes = data || [];
    render();
  }

  function diasRestantes(fechaStr){
    const hoy = new Date(); hoy.setHours(0,0,0,0);
    const f = new Date(fechaStr + 'T00:00:00');
    return Math.round((f - hoy) / 86400000);
  }
  function estadoCliente(c){
    const dias = diasRestantes(c.fecha);
    if(c.urgente || dias <= 2) return 'urgente';
    if(dias <= 6) return 'proximo';
    return 'ok';
  }

  function render(){
    const list = document.getElementById('clientList');
    let items = [...clientes];
    if(filtro !== 'todos') items = items.filter(c => estadoCliente(c) === filtro);

    if(items.length === 0){
      list.innerHTML = '<div class="empty">Sin pedidos en esta vista. Agrega un cliente desde el formulario.</div>';
      return;
    }

    list.innerHTML = items.map(c => {
      const estado = estadoCliente(c);
      const dias = diasRestantes(c.fecha);
      const badgeText = estado === 'urgente' ? 'Urgente' : `${dias} días`;
      const medidasArr = [
        ['Pecho', c.pecho], ['Cintura', c.cintura], ['Cadera', c.cadera], ['Hombro', c.hombro],
        ['Manga', c.manga], ['Pierna', c.pierna], ['Cuello', c.cuello], ['Espalda', c.espalda]
      ].filter(m => m[1] !== null && m[1] !== undefined && m[1] !== '');
      return `
        <div class="client ${estado}">
          <div class="client-top">
            <div>
              <h3>${escapeHtml(c.nombre)}</h3>
              <div class="meta">${escapeHtml(c.prenda)} · Entrega: ${formatFecha(c.fecha)} ${c.telefono ? '· ' + escapeHtml(c.telefono) : ''}</div>
            </div>
            <span class="badge ${estado}">${badgeText}</span>
          </div>
          ${medidasArr.length ? `<div class="medidas">${medidasArr.map(m => `<span>${m[0]}: <b>${m[1]} cm</b></span>`).join('')}</div>` : ''}
          <div class="client-actions">
            <button onclick="marcarListo('${c.id}')">Marcar listo</button>
            <button class="del" onclick="eliminarCliente('${c.id}')">Eliminar</button>
          </div>
        </div>`;
    }).join('');
  }

  function formatFecha(f){
    const d = new Date(f + 'T00:00:00');
    return d.toLocaleDateString('es-BO', {day:'2-digit', month:'short', year:'numeric'});
  }
  function escapeHtml(s){
    const div = document.createElement('div'); div.textContent = s ?? ''; return div.innerHTML;
  }

  async function marcarListo(id){
    await window.sb.from('clientes').delete().eq('id', id);
    await cargarClientes();
  }
  async function eliminarCliente(id){
    await window.sb.from('clientes').delete().eq('id', id);
    await cargarClientes();
  }

  document.getElementById('filters').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    document.querySelectorAll('#filters button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    filtro = b.dataset.f;
    render();
  });

  document.getElementById('clientForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const msg = document.getElementById('formMsg');
    const btn = document.getElementById('submitBtn');
    const nombre = document.getElementById('nombre').value.trim();
    const fecha = document.getElementById('fecha').value;
    if(!nombre || !fecha){
      msg.textContent = 'Falta nombre o fecha de entrega.';
      msg.className = 'status-msg err';
      return;
    }
    btn.disabled = true; btn.textContent = 'Guardando…';
    const nuevo = {
      nombre, telefono: document.getElementById('telefono').value.trim(),
      prenda: document.getElementById('prenda').value,
      pecho: document.getElementById('pecho').value || null,
      cintura: document.getElementById('cintura').value || null,
      cadera: document.getElementById('cadera').value || null,
      hombro: document.getElementById('hombro').value || null,
      manga: document.getElementById('manga').value || null,
      pierna: document.getElementById('pierna').value || null,
      cuello: document.getElementById('cuello').value || null,
      espalda: document.getElementById('espalda').value || null,
      fecha, urgente: document.getElementById('urgente').checked,
    };
    const { error } = await window.sb.from('clientes').insert([nuevo]);
    btn.disabled = false; btn.textContent = 'Guardar cliente';
    if(error){
      msg.textContent = 'No se pudo guardar: ' + error.message;
      msg.className = 'status-msg err';
      return;
    }
    msg.textContent = 'Cliente guardado.';
    msg.className = 'status-msg ok';
    e.target.reset();
    await cargarClientes();
    setTimeout(()=>{ msg.textContent=''; }, 2500);
  });

  checkSession();
</script>

</body>
</html>
